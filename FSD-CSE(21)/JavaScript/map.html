<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map_UseCase</title>
</head>
<body>
    
    <script>
       let nums = [1,2,3,4,5,6,7,8];

       let doubled = nums.map( num => num*2);

       console.log(doubled);
       console.log(nums);

    //    difference between foreach and map
    // foreach loop only picks an element but does not perform any operation While the map picks elements as well as perform some operation on each element 
    // map does not make changes in the same arr but it duplicates that array and provide that original array remains unchanged
    </script>

</body>
</html>
