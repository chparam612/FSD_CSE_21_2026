<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays</title>
</head>
<body>
    
    <script>
        const car=['car1','car2','car3'];
        let text = " ";
        for(let i=0;i<car.length;i++){
            // document.write((i+1)+"."+car[i]+" ");
            if(car[i] === "car2"){
                continue;
            }
            text += car[i] + "<br>";
        }
        document.write(text);
    </script>
</body>
</html>
